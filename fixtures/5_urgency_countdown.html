<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbor &amp; Pine - Limited Offer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
      color: #0f172a;
    }
    .offer {
      margin: 20px 0;
      padding: 16px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      font-weight: 600;
    }
    .price {
      font-size: 24px;
      font-weight: 700;
    }
    .note {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
    .button {
      display: block;
      margin-top: 20px;
      padding: 12px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Harbor &amp; Pine Weekend Bag</h1>
    <p>Carry-on size with a water-resistant outer fabric and a padded laptop sleeve.</p>
    <p class="price">$48.00</p>
    <p class="offer">Offer ends in 10 minutes.</p>
    <p class="note">The countdown message is shown as page evidence. This scan cannot verify whether the deadline is genuine.</p>
    <a class="button" href="#">View bag details</a>
  </main>
</body>
</html>
