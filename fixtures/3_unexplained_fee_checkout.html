<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTicket Express - Order Review</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .line-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 10px;
      color: #475569;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      color: #b91c1c;
      padding-top: 10px;
      border-top: 2px solid #e2e8f0;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
      background: #fef2f2;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #fecaca;
    }
    .btn {
      display: block;
      width: 100%;
      background: #dc2626;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 24px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cart Summary</h1>

    <div class="line-item">
      <span>Subtotal:</span>
      <span>$50.00</span>
    </div>

    <div class="line-item">
      <span>Processing Fee:</span>
      <span>$4.00</span>
    </div>

    <div class="line-item">
      <span>Service Fee:</span>
      <span>$3.00</span>
    </div>

    <!-- Arithmetic check: $50 + $4 + $3 = $57. Order total is $65.00 ($8.00 unexplained difference) -->
    <div class="total-row">
      <span>Order Total:</span>
      <span>$65.00</span>
    </div>

    <div class="note">
      <p>Review your order before proceeding. Non-refundable ticket reservation.</p>
    </div>

    <a href="#" class="btn">Confirm Payment ($65.00)</a>
  </div>
</body>
</html>
