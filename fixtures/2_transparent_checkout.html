<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Gear Supply - Checkout</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .line-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 10px;
      color: #475569;
    }
    .line-item.bold {
      font-weight: 600;
      color: #0f172a;
    }
    .divider {
      border-top: 1px dashed #cbd5e1;
      margin: 16px 0;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      padding-top: 10px;
      border-top: 2px solid #e2e8f0;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    .btn {
      display: block;
      width: 100%;
      background: #059669;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 24px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cart Summary</h1>

    <div class="line-item">
      <span>Subtotal:</span>
      <span>$60.00</span>
    </div>

    <div class="line-item">
      <span>Shipping:</span>
      <span>$8.00</span>
    </div>

    <div class="line-item">
      <span>Estimated Tax:</span>
      <span>$5.00</span>
    </div>

    <div class="total-row">
      <span>Order Total:</span>
      <span>$73.00</span>
    </div>

    <div class="note">
      <p>All charges and taxes are itemized above. This is a one-time purchase with no recurring fees.</p>
    </div>

    <a href="#" class="btn">Place Order ($73.00)</a>
  </div>
</body>
</html>
